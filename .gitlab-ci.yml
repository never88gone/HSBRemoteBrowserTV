stages:
  - build

variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  PATH: "/opt/homebrew/opt/ruby/bin:/opt/homebrew/bin:/usr/local/opt/ruby/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"

.base_build:
  stage: build
  tags:
    - macos
  interruptible: false
  before_script:
    - bundle install --jobs 4 --retry 3
    - bundle exec fastlane --version

# dev / main 或 releases/* -> HSBWatchCompanion (iOS & Watch)
build_companion:
  extends: .base_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^releases\//'
  script:
    - bundle exec fastlane ios build_companion
