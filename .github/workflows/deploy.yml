name: Auto Deploy & Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'HSBWatchApp/HSBWatchCompanion/AppVersion.xcconfig'
      - '.github/workflows/deploy.yml'
      - 'HSBWatchApp/fastlane/**'
      - 'script/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制执行打包与 TestFlight 发布 (忽略版本号变动检查)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Check Version Change or Manual Trigger
        id: check_trigger
        run: |
          PATH_CONFIG="HSBWatchApp/HSBWatchCompanion/AppVersion.xcconfig"
          curr_val=$(grep -E "^GITHUB_VERSION\s*=" "$PATH_CONFIG" | cut -d'=' -f2 | tr -d '[:space:]')
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            prev_content=$(git show HEAD~1:"$PATH_CONFIG" 2>/dev/null || echo "")
            prev_val=$(echo "$prev_content" | grep -E "^GITHUB_VERSION\s*=" | cut -d'=' -f2 | tr -d '[:space:]')
          else
            prev_val=""
          fi
          echo "Old version: '$prev_val', New version: '$curr_val'"
          
          FORCE_RUN="${{ github.event.inputs.force_deploy }}"
          if [ "$FORCE_RUN" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "🚀 手动触发：已开启强制打包发布 (force_deploy = true)"
          elif [ -n "$curr_val" ] && [ "$curr_val" != "$prev_val" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本号更新 ($prev_val -> $curr_val)，触发自动发布"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⏸️ 未检测到版本号变更且未指定强制发布，跳过本次打包"
          fi
          
          # 无论触发方式，统一注入当前精准时间版本号
          EFFECTIVE_BUILD="${curr_val:-$(date +"%Y%m%d%H%M%S")}"
          echo "BUILD_NUMBER=$EFFECTIVE_BUILD" >> $GITHUB_ENV
          echo "THLBROWSER_BUILD_NUMBER=$EFFECTIVE_BUILD" >> $GITHUB_ENV
          echo "📌 生效构建编号: $EFFECTIVE_BUILD"

      - name: Verify Required Secrets
        if: steps.check_trigger.outputs.should_deploy == 'true'
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROV_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROV_B64" ] || [ -z "$KEY_ID" ]; then
            echo "❌ 缺少必要的 GitHub Secrets！"
            echo "请确保在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置了以下密钥："
            echo "  - BUILD_CERTIFICATE_BASE64"
            echo "  - BUILD_PROVISION_PROFILE_BASE64"
            echo "  - APP_STORE_CONNECT_KEY_ID"
            echo "参考本地模版: fastlane/github_secrets.env"
            exit 1
          fi
          echo "✅ 基础发布密钥校验通过"

      - name: Install Apple Certificate and Provisioning Profile
        if: steps.check_trigger.outputs.should_deploy == 'true'
        env:
          BUILD_CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WATCH_PROVISION_BASE64: ${{ secrets.BUILD_WATCH_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASS: "hsb_temp_keychain_${{ github.run_id }}"
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          WATCH_PP_PATH=$RUNNER_TEMP/build_watch_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERT_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROVISION_BASE64" | base64 --decode -o $PP_PATH
          if [ -n "$WATCH_PROVISION_BASE64" ]; then
            echo -n "$WATCH_PROVISION_BASE64" | base64 --decode -o $WATCH_PP_PATH
          fi

          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # 解析 iOS 主 App Profile UUID 并重命名拷贝
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/main_pp.plist
          MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/main_pp.plist)
          echo "Main App Provisioning Profile UUID: $MAIN_UUID"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$MAIN_UUID.mobileprovision"
          
          # 解析 Watch App Profile UUID 并重命名拷贝
          if [ -f "$WATCH_PP_PATH" ]; then
            security cms -D -i "$WATCH_PP_PATH" > $RUNNER_TEMP/watch_pp.plist
            WATCH_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/watch_pp.plist)
            echo "Watch App Provisioning Profile UUID: $WATCH_UUID"
            cp "$WATCH_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$WATCH_UUID.mobileprovision"
          fi

      - name: Set up Ruby and Bundler
        if: steps.check_trigger.outputs.should_deploy == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run Fastlane Beta (Archive & TestFlight Upload)
        if: steps.check_trigger.outputs.should_deploy == 'true'
        working-directory: HSBWatchApp
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          THLBROWSER_BUILD_NUMBER: ${{ env.THLBROWSER_BUILD_NUMBER }}
        run: |
          gem install fastlane --no-document
          fastlane beta

      - name: Cleanup Temporary Keychain
        if: always() && steps.check_trigger.outputs.should_deploy == 'true'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH || true
            echo "🧹 临时钥匙串已安全清除"
          fi
