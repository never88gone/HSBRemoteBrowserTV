name: Auto Deploy & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: '自定义构建编号 (留空则云端自动按时间戳递增生成，例如 20261022104500)'
        required: false
        type: string
        default: ''
      skip_testflight:
        description: '仅执行打包构建，跳过上传至 TestFlight'
        required: false
        type: boolean
        default: false

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Trust Xcode Macros and Plugins
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Generate Dynamic Build Number
        id: build_meta
        run: |
          PATH_CONFIG="HSBWatchApp/HSBWatchCompanion/AppVersion.xcconfig"
          MARKETING_VER=$(grep -E "^MARKETING_VERSION\s*=" "$PATH_CONFIG" 2>/dev/null | cut -d'=' -f2 | tr -d '[:space:]' || echo "1.0.0")
          MARKETING_VER="${MARKETING_VER:-1.0.0}"
          
          INPUT_BUILD="${{ github.event.inputs.build_number }}"
          if [ -n "$INPUT_BUILD" ]; then
            AUTO_BUILD="$INPUT_BUILD"
            echo "🔧 使用手动指定的 Build Number: $AUTO_BUILD"
          else
            # 自动生成精确单调递增时间戳作为构建号 (格式: YYYYMMDDHHMMSS)
            AUTO_BUILD=$(date +"%Y%m%d%H%M%S")
            echo "🚀 自动动态生成单调递增 Build Number: $AUTO_BUILD"
          fi
          
          echo "BUILD_NUMBER=$AUTO_BUILD" >> $GITHUB_ENV
          echo "THLBROWSER_BUILD_NUMBER=$AUTO_BUILD" >> $GITHUB_ENV
          echo "MARKETING_VERSION=$MARKETING_VER" >> $GITHUB_ENV
          echo "SKIP_TESTFLIGHT=${{ github.event.inputs.skip_testflight || 'false' }}" >> $GITHUB_ENV
          
          echo "=========================================="
          echo "📱 目标营销版本 (Marketing Version): $MARKETING_VER"
          echo "🔢 动态构建编号 (Build Number):      $AUTO_BUILD"
          echo "📤 跳过 TestFlight 上传:            ${{ github.event.inputs.skip_testflight || 'false' }}"
          echo "=========================================="
          
          echo "### 🚀 Release 构建配置" >> $GITHUB_STEP_SUMMARY
          echo "- **营销版本 (Marketing Version)**: \`$MARKETING_VER\`" >> $GITHUB_STEP_SUMMARY
          echo "- **动态构建号 (Build Number)**: \`$AUTO_BUILD\`" >> $GITHUB_STEP_SUMMARY
          echo "- **触发类型**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify Required Secrets
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROV_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROV_B64" ] || [ -z "$KEY_ID" ]; then
            echo "❌ 缺少必要的 GitHub Secrets！"
            echo "请确保在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置了以下密钥："
            echo "  - BUILD_CERTIFICATE_BASE64"
            echo "  - BUILD_PROVISION_PROFILE_BASE64"
            echo "  - APP_STORE_CONNECT_KEY_ID"
            echo "  - APP_STORE_CONNECT_ISSUER_ID"
            echo "  - APP_STORE_CONNECT_KEY_CONTENT"
            echo "  - P12_PASSWORD"
            echo "参考本地模板: fastlane/github_secrets.env"
            exit 1
          fi
          echo "✅ 基础发布密钥校验通过"

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WATCH_PROVISION_BASE64: ${{ secrets.BUILD_WATCH_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASS: "hsb_temp_keychain_${{ github.run_id }}"
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          WATCH_PP_PATH=$RUNNER_TEMP/build_watch_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERT_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROVISION_BASE64" | base64 --decode -o $PP_PATH
          if [ -n "$WATCH_PROVISION_BASE64" ]; then
            echo -n "$WATCH_PROVISION_BASE64" | base64 --decode -o $WATCH_PP_PATH
          fi

          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          # 解析 iOS 主 App Profile UUID 并重命名拷贝
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/main_pp.plist
          MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/main_pp.plist)
          echo "Main App Provisioning Profile UUID: $MAIN_UUID"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$MAIN_UUID.mobileprovision"
          
          # 解析 Watch App Profile UUID 并重命名拷贝
          if [ -f "$WATCH_PP_PATH" ]; then
            security cms -D -i "$WATCH_PP_PATH" > $RUNNER_TEMP/watch_pp.plist
            WATCH_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $RUNNER_TEMP/watch_pp.plist)
            echo "Watch App Provisioning Profile UUID: $WATCH_UUID"
            cp "$WATCH_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$WATCH_UUID.mobileprovision"
          fi

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: HSBWatchApp

      - name: Run Fastlane Beta (Archive & TestFlight Upload)
        working-directory: HSBWatchApp
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          THLBROWSER_BUILD_NUMBER: ${{ env.THLBROWSER_BUILD_NUMBER }}
          SKIP_TESTFLIGHT: ${{ env.SKIP_TESTFLIGHT }}
        run: |
          bundle exec fastlane beta

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-ipa-${{ env.BUILD_NUMBER }}
          path: Artifacts/AppStore/*/ios/export/*.ipa
          if-no-files-found: ignore

      - name: Cleanup Temporary Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH || true
            echo "🧹 临时钥匙串已安全清除"
          fi
